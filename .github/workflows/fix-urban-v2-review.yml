name: Fix Urban V2 review
on:
  push:
    branches: [feature/urban-sim-v2]
    paths: [.github/workflows/fix-urban-v2-review.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/urban-sim-v2
      - name: Patch review findings
        shell: python
        run: |
          from pathlib import Path
          p=Path('urban-sim/app.js'); s=p.read_text()
          old="""    const affordability = clamp(70 - avg(cells.filter(c => c.kind === 'residential' && c.developed).map(c => c.rent || computeRent(cells.indexOf(c)))) * .5, -20, 30);"""
          new="""    const residentialRents = [];
    for (let i = 0; i < CELL_COUNT; i++) {
      const c = cells[i];
      if (c.kind === 'residential' && c.developed) residentialRents.push(c.rent || computeRent(i));
    }
    const affordability = clamp(70 - avg(residentialRents) * .5, -20, 30);"""
          assert old in s; s=s.replace(old,new,1)
          old="""    if (selectedTool === 'bulldoze') {
      const affected = households.filter(h => h.home === i).length;
      households = households.filter(h => h.home !== i);
      for (const h of households) if (h.work === i) h.work = -1;
      if (budget < COSTS.bulldoze) return;
      budget -= COSTS.bulldoze;
      setCellKind(i, 'empty');
      if (affected) addEvent(`${affected}世帯が再開発による立退きで市外へ転出しました。`, 'warn');"""
          new="""    if (selectedTool === 'bulldoze') {
      if (budget < COSTS.bulldoze) { addEvent('撤去費用が不足しています。', 'bad'); return; }
      const affected = households.filter(h => h.home === i).length;
      budget -= COSTS.bulldoze;
      households = households.filter(h => h.home !== i);
      for (const h of households) if (h.work === i) { h.work = -1; h.employedWorkers = 0; }
      setCellKind(i, 'empty');
      if (affected) addEvent(`${affected}世帯が再開発による立退きで市外へ転出しました。`, 'warn');"""
          assert old in s; s=s.replace(old,new,1)
          old="""    selectedIndex = i;
    rebuildRoadNetwork();
    computeEnvironmentalFields();
    currentMetrics = computeMetrics(currentMetrics?.transitShare || 0);
    updateUI();"""
          new="""    selectedIndex = i;
    runEconomyPass(true);"""
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
      - name: Syntax and invariant checks
        run: |
          node --check urban-sim/app.js
          ! grep -q "computeRent(cells.indexOf(c))" urban-sim/app.js
          grep -q "if (budget < COSTS.bulldoze)" urban-sim/app.js
          grep -q "runEconomyPass(true);" urban-sim/app.js
      - name: Deterministic 24-month simulation smoke test
        run: |
          cat > /tmp/smoke.cjs <<'NODE'
          const fs=require('fs'),vm=require('vm');
          let seed=123456789; Math.random=()=>((seed=(1664525*seed+1013904223)>>>0)/4294967296);
          const ctx=new Proxy({}, {get:(t,p)=>p==='measureText'?(()=>({width:0})):(()=>{}),set:(t,p,v)=>true});
          class E{constructor(id){this.id=id;this.value=id==='incomeTax'?'9':id==='propertyTax'?'1.2':id==='speedRange'?'1':'0';this.checked=false;this.style={};this.classList={toggle(){}};this.hidden=false;this.textContent='';this.innerHTML='';this.width=1000;this.height=650;}getContext(){return ctx}getBoundingClientRect(){return {width:this.id==='historyCanvas'?600:1000,height:this.id==='historyCanvas'?160:650,left:0,top:0}}addEventListener(){}querySelectorAll(){return []}closest(){return null}setPointerCapture(){}}
          const els=new Map(); const document={getElementById:id=>els.get(id)||els.set(id,new E(id)).get(id)};
          const store=new Map(); const localStorage={setItem:(k,v)=>store.set(k,v),getItem:k=>store.get(k)||null};
          const sandbox={console,Math,document,localStorage,setInterval:()=>1,clearInterval(){},requestAnimationFrame:f=>f(),ResizeObserver:class{constructor(f){}observe(){}},window:{devicePixelRatio:1,addEventListener(){}}}; sandbox.globalThis=sandbox;
          let src=fs.readFileSync('urban-sim/app.js','utf8');
          src=src.replace(/\}\)\(\);\s*$/,`globalThis.__t={simulateMonth,get metrics(){return {...currentMetrics}},get budget(){return budget},get households(){return households.length}};})();`);
          vm.createContext(sandbox); vm.runInContext(src,sandbox,{filename:'app.js'});
          const t=sandbox.__t, initial={...t.metrics,budget:t.budget,households:t.households};
          if(!Number.isFinite(initial.happiness)||initial.population<100||initial.employment<0.45) throw Error('bad initial state '+JSON.stringify(initial));
          for(let i=0;i<24;i++) t.simulateMonth();
          const after={...t.metrics,budget:t.budget,households:t.households};
          for(const k of ['population','employment','happiness','traffic','landValue','pollution']) if(!Number.isFinite(after[k])) throw Error('non-finite '+k);
          if(after.population < initial.population*.55) throw Error('population collapse '+JSON.stringify({initial,after}));
          if(after.employment<0.35) throw Error('employment collapse '+JSON.stringify(after));
          if(after.budget<=-60000) throw Error('fiscal collapse '+JSON.stringify(after));
          console.log(JSON.stringify({initial,after},null,2));
          NODE
          node /tmp/smoke.cjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-urban-v2-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address Urban Lab V2 review findings"
          git push origin HEAD:feature/urban-sim-v2